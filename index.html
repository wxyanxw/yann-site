<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的个人网站</title>
  <!-- 把下面 title 改成你的名字/站点名 -->
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
    }
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 24px 64px;
    }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    .subtitle { color: var(--accent); font-weight: 600; margin: 0 0 24px; }
    p { color: var(--muted); }
    .links { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }
    .links a {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: var(--fg);
      font-size: 0.95rem;
      transition: border-color .15s, color .15s;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- ↓↓↓ 把下面的占位内容换成你自己的 ↓↓↓ -->
    <h1>你的名字</h1>
    <p class="subtitle">一句话介绍你自己，比如：嵌入式 / 边缘 AI 开发者</p>

    <p>
      这是用 Vercel + 纯静态 HTML 搭的最小个人网站。
      你可以把下面的文字、链接替换成自己的简介、项目或博客入口。
    </p>

    <div class="links">
      <a href="https://github.com/wxyanxw" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:you@example.com">邮箱</a>
      <a href="https://vercel.com/wxyanxw-dev" target="_blank" rel="noopener">Vercel</a>
      <!-- 想加更多链接，复制上面一行改 href 和文字即可 -->
    </div>

    <footer>© <span id="year"></span> 你的名字 · Powered by Vercel</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
